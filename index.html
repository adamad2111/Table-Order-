<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Order</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1c1917;--mu:#78716c;--ac:#ea580c;--ac2:#fb923c;--on:#fff;--bd:#e7e1d8;--ok:#16a34a;--chip:#efe9df;--sh:0 1px 2px rgba(28,25,23,.06),0 8px 24px rgba(28,25,23,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12100e;--card:#1c1917;--tx:#f5f5f4;--mu:#a8a29e;--ac:#fb923c;--ac2:#f97316;--on:#1c1917;--bd:#33302c;--ok:#4ade80;--chip:#292524;--sh:0 1px 2px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#12100e;--card:#1c1917;--tx:#f5f5f4;--mu:#a8a29e;--ac:#fb923c;--ac2:#f97316;--on:#1c1917;--bd:#33302c;--ok:#4ade80;--chip:#292524;--sh:0 1px 2px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;padding-bottom:120px}
button{font:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.brand{font-size:17px}
nav{display:flex;background:var(--chip);border-radius:99px;padding:4px}
nav button{border:0;background:none;color:var(--mu);padding:8px 16px;border-radius:99px;font-weight:600}
nav button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
h1{font-size:26px;font-weight:800;margin:10px 16px 2px;letter-spacing:-.02em}
.sub{margin:0 16px 12px;color:var(--mu);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;background:var(--chip);color:var(--tx);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap}
.cat{margin:22px 16px 6px;font-size:18px;font-weight:800;scroll-margin-top:120px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;margin:8px 16px;padding:12px;box-shadow:var(--sh)}
.em{width:54px;height:54px;border-radius:15px;background:var(--chip);display:grid;place-items:center;font-size:28px;flex:none}
.grow{flex:1;min-width:0}
.nm{font-weight:700}.pr{color:var(--mu);font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty b{min-width:18px;text-align:center}
.qty button{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);color:var(--tx);font-size:22px;line-height:1}
.qty button.add{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on)}
.card{display:block;background:var(--card);border-radius:20px;margin:10px 16px;padding:14px 16px;box-shadow:var(--sh)}
.card.status{border:2px solid var(--ac)}
.card.s-new{border-left:5px solid var(--ac)}.card.s-preparing{border-left:5px solid #f59e0b}.card.s-ready{border-left:5px solid var(--ok)}.card.s-paid{border-left:5px solid var(--bd)}
input{width:100%;padding:14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;margin-top:8px}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.bar{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 45%);max-width:640px;margin:0 auto;z-index:8}
.btn{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font:inherit;font-size:17px;font-weight:700;box-shadow:0 8px 20px rgba(234,88,12,.3)}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--chip);color:var(--tx)}
.badge.new{background:var(--ac);color:var(--on)}.badge.preparing{background:#f59e0b;color:#1c1917}.badge.ready{background:var(--ok);color:var(--on)}
.note{margin:12px 16px;padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--sh);color:var(--mu);font-size:14px}
.tabs{display:flex;gap:6px;margin:8px 16px}
.tabs button{flex:1;padding:10px 6px;border-radius:12px;border:0;background:var(--chip);color:var(--mu);font-size:14px;font-weight:600}
.tabs button.on{background:var(--tx);color:var(--bg)}
.steps{display:flex;margin:16px 0 12px}
.st{flex:1;text-align:center;position:relative;font-size:12px;color:var(--mu)}
.st i{display:block;width:14px;height:14px;border-radius:50%;background:var(--bd);margin:0 auto 6px;position:relative;z-index:1}
.st:not(:first-child)::before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--bd)}
.st.done i,.st.done:not(:first-child)::before{background:var(--ok)}
.st.done span{color:var(--tx);font-weight:600}
.del{padding:9px 14px;border-radius:10px;border:0;background:rgba(220,38,38,.12);color:#dc2626;font-weight:700}
ul{margin:8px 0 10px;padding-left:18px}li{padding:2px 0}
</style>
</head>
<body>
<header><div class="brand">🍽️ <b>Table Order</b></div><nav><button id="tC" class="on">Order</button><button id="tK">Cashier</button></nav></header>
<div id="app"></div>
<div id="bar" class="bar" hidden></div>

<script>
var DEFAULTS=[
 ["Starters",[["🥗","Garden Salad",6.5],["🍤","Crispy Shrimp",9],["🍲","Tomato Soup",5.5]]],
 ["Mains",[["🍔","Classic Burger",12],["🍕","Margherita Pizza",13],["🍝","Pasta Carbonara",14],["🐟","Grilled Salmon",18]]],
 ["Drinks & Desserts",[["🥤","Soft Drink",3],["🍋","Fresh Lemonade",4],["🍰","Cheesecake",6.5]]]
];
var MENU=[],FLAT={},isAdmin=false,STAFF_PIN="1234",staffOk=false;
function buildMenu(docs){var g={},o=[];FLAT={};
 docs.forEach(function(d){var x=d.data(),c=x.cat||"Menu",p=Number(x.price)||0;if(!g[c]){g[c]=[];o.push([c,g[c]])}g[c].push([x.emoji||"🍽️",x.name,p,d.id]);FLAT[x.name]={e:x.emoji,n:x.name,p:p}});
 MENU=o;for(var k in cart)if(!FLAT[k])delete cart[k]}
var cart={},table="",name="",needAt="",db=null,view=(location.hash==="#cashier")?"K":"C";
var myId=null,myOrder=null,orders=[],tab="active",known=null,audio=null;
try{myId=localStorage.getItem("lastOrder")}catch(e){}

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return "MVR "+n.toFixed(2)}
function total(){var t=0;for(var k in cart)t+=cart[k]*FLAT[k].p;return t}
function count(){var t=0;for(var k in cart)t+=cart[k];return t}

function setView(v){view=v;$("tC").className=v==="C"?"on":"";$("tK").className=v==="K"?"on":"";render()}
$("tC").onclick=function(){setView("C")};$("tK").onclick=function(){setView("K")};

function render(){view==="C"?renderCustomer():renderCashier()}

function steps(s){var f=["new","preparing","ready","paid"],i=f.indexOf(s);return '<div class="steps">'+f.map(function(x,k){return '<div class="st'+(k<=i?' done':'')+'"><i></i><span>'+label(x)+'</span></div>'}).join("")+'</div>'}
function renderCustomer(){
  var h='<h1>Welcome 👋</h1><p class="sub">Pick your items, then send the order straight to the kitchen and cashier.</p>';
  if(!db)h+='<div class="note">Live ordering isn’t available in this view, so orders can’t be sent right now.</div>';
  if(!MENU.length)h+='<div class="note">The menu is being updated. Please check back shortly.</div>';
  if(myOrder&&myOrder.exists){var o=myOrder.data();
    h+='<div class="card status"><div class="row"><b>Order #'+esc(o.code)+'</b><span class="badge '+esc(o.status)+'">'+label(o.status)+'</span></div>'+steps(o.status)+'<div class="pr">Table '+esc(o.table)+' · '+money(o.total)+'</div><div class="pr">Needed at: <b>'+needTxt(o)+'</b> · Ready at: <b>'+readyTxt(o)+'</b></div></div>';}
  if(MENU.length)h+='<div class="chips">'+MENU.map(function(c,k){return '<button data-go="c'+k+'">'+esc(c[0])+'</button>'}).join("")+'</div>';
  MENU.forEach(function(c,ci){
    h+='<div class="cat" id="c'+ci+'">'+esc(c[0])+'</div>';
    c[1].forEach(function(i){var q=cart[i[1]]||0;
      h+='<div class="item"><div class="em">'+esc(i[0])+'</div><div class="grow"><div class="nm">'+esc(i[1])+'</div><div class="pr">'+money(i[2])+'</div></div><div class="qty">'+
      (q?'<button data-m="'+esc(i[1])+'">−</button><b>'+q+'</b>':'')+'<button class="add" data-p="'+esc(i[1])+'">+</button></div></div>';});
  });
  h+='<div class="cat">Your details</div><div class="card form"><input id="tb" placeholder="Table number" inputmode="numeric" value="'+esc(table)+'"><input id="nm" placeholder="Name (optional)" value="'+esc(name)+'"><div class="pr" style="margin-top:10px">Needed at (leave empty for as soon as possible)</div><input id="nd" type="time" value="'+esc(needAt)+'"></div>';
  $("app").innerHTML=h;
  var n=count();$("bar").hidden=!n;
  $("bar").innerHTML='<button class="btn" id="send" '+(db?'':'disabled')+'>Place order · '+n+' item'+(n>1?'s':'')+' · '+money(total())+'</button>';
  $("tb").oninput=function(){table=this.value};$("nm").oninput=function(){name=this.value};$("nd").oninput=function(){needAt=this.value};
  if($("send"))$("send").onclick=place;
}
document.addEventListener("click",function(e){
  var p=e.target.getAttribute&&e.target.getAttribute("data-p"),m=e.target.getAttribute&&e.target.getAttribute("data-m");
  if(p){cart[p]=(cart[p]||0)+1;renderCustomer()}
  if(m){cart[m]--;if(cart[m]<=0)delete cart[m];renderCustomer()}
});

async function place(){
  if(!db||!count())return;
  if(!table.trim()){alert("Please enter your table number.");$("tb").focus();return}
  var items=Object.keys(cart).map(function(k){return{name:k,qty:cart[k],price:FLAT[k].p}});
  var code=String(Math.floor(Math.random()*900)+100);
  var ref=db.collection("orders").doc();
  $("send").disabled=true;
  try{
    await ref.set({code:code,table:table.trim(),customer:name.trim(),items:items,total:total(),status:"new",createdAt:Date.now(),needAt:needAt||"",readyAt:0});
    myId=ref.id;try{localStorage.setItem("lastOrder",myId)}catch(e){}
    cart={};needAt="";watchMine();
    alert("Order #"+code+" sent! The cashier can see it now.");
  }catch(err){alert("Couldn’t send the order ("+(err&&err.code||"error")+"). Please ask the staff for help.");}
  render();
}
var unMine=null;
function watchMine(){
  if(!db||!myId)return;if(unMine)unMine();
  unMine=db.doc("orders/"+myId).onSnapshot(function(s){myOrder=s;if(view==="C")renderCustomer()},function(){});
}

var FLOW=["new","preparing","ready","paid"];
function hm(ms){return new Date(ms).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function needTxt(o){if(!o.needAt)return"ASAP";var p=o.needAt.split(":");return hm(new Date().setHours(+p[0],+p[1],0,0))}
function readyTxt(o){return o.readyAt?hm(o.readyAt):"not yet"}
function label(s){return{new:"Received",preparing:"Preparing",ready:"Ready",paid:"Paid"}[s]||s}
function nextLabel(s){return{new:"Start preparing",preparing:"Mark ready",ready:"Mark paid"}[s]}

function renderCashier(){
  $("bar").hidden=true;
  if(!staffOk){$("app").innerHTML='<h1>Staff only</h1><p class="sub">Enter the staff PIN to see orders and manage the menu.</p><div class="card form"><input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN"><button class="btn" id="pinGo" style="margin-top:8px">Open</button></div>';$("pinGo").onclick=function(){if($("pin").value===STAFF_PIN){staffOk=true;renderCashier()}else alert("Wrong PIN.")};return}
  var act=orders.filter(function(d){return d.data().status!=="paid"}),done=orders.filter(function(d){return d.data().status==="paid"});
  var list=tab==="active"?act:done;
  var h='<h1>Cashier</h1><p class="sub">Orders appear here the moment customers send them.</p>';
  if(!db)h+='<div class="note">Live data isn’t available in this view.</div>';
  h+='<div class="tabs"><button data-t="active" class="'+(tab==="active"?"on":"")+'">Active ('+act.length+')</button><button data-t="done" class="'+(tab==="done"?"on":"")+'">Paid ('+done.length+')</button><button data-t="menu" class="'+(tab==="menu"?"on":"")+'">Menu</button></div>';
  if(tab==="menu"){$("app").innerHTML=h+menuMgr();bindMenu();return}
  if(!list.length)h+='<div class="note">No orders here yet.</div>';
  list.forEach(function(d){var o=d.data(),t=new Date(o.createdAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    h+='<div class="card s-'+esc(o.status)+'"><div class="row"><b>#'+esc(o.code)+' · Table '+esc(o.table)+'</b><span class="badge '+esc(o.status)+'">'+label(o.status)+'</span></div>'+
    '<div class="pr">Ordered '+t+(o.customer?' · '+esc(o.customer):'')+'</div>'+
    '<div class="pr"><b>Needed at: '+needTxt(o)+'</b> · Ready at: '+readyTxt(o)+'</div><ul>'+
    (o.items||[]).map(function(i){return'<li>'+i.qty+' × '+esc(i.name)+'</li>'}).join("")+'</ul>'+
    '<div class="row"><b>'+money(o.total||0)+'</b></div>'+
    (nextLabel(o.status)?'<button class="btn" style="margin-top:8px" data-adv="'+d.id+'" data-s="'+o.status+'">'+nextLabel(o.status)+'</button>':'')+'</div>';
  });
  $("app").innerHTML=h;
}
document.addEventListener("click",function(e){
  var t=e.target.getAttribute&&e.target.getAttribute("data-t");if(t){tab=t;renderCashier()}
  var a=e.target.getAttribute&&e.target.getAttribute("data-adv");
  if(a&&db){var s=e.target.getAttribute("data-s");
    var ns=FLOW[FLOW.indexOf(s)+1],patch={status:ns};if(ns==="ready")patch.readyAt=Date.now();
    db.doc("orders/"+a).update(patch).catch(function(){alert("Couldn’t update the order.")});}
});

function menuMgr(){
  if(!isAdmin)return '<div class="note">You don’t have permission to change the menu.</div>';
  var h='<div class="card"><b>Add item</b><input id="mE" placeholder="Emoji (e.g. 🍔)" maxlength="4"><input id="mN" placeholder="Item name"><input id="mP" placeholder="Price" inputmode="decimal"><input id="mC" placeholder="Category (e.g. Mains)" list="cats"><datalist id="cats">'+MENU.map(function(c){return '<option value="'+esc(c[0])+'">'}).join("")+'</datalist><button class="btn" id="mAdd" style="margin-top:8px">Add item</button></div>';
  if(!MENU.length)h+='<div class="note">The menu is empty. <button class="btn" id="mSeed" style="margin-top:8px">Load sample menu</button></div>';
  MENU.forEach(function(c){h+='<div class="cat">'+esc(c[0])+'</div>';c[1].forEach(function(i){
    h+='<div class="item"><div class="em">'+esc(i[0])+'</div><div class="grow"><div class="nm">'+esc(i[1])+'</div><div class="pr">'+money(i[2])+'</div></div><button class="del" data-del="'+i[3]+'">Delete</button></div>'})});
  return h}
function toast(m){var t=document.createElement("div");t.className="note";t.style.cssText="position:fixed;left:12px;right:12px;bottom:80px;z-index:20;max-width:616px;margin:0 auto";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3500)}
function bindMenu(){
  var a=$("mAdd"),s=$("mSeed");
  if(a)a.onclick=function(){
    var n=$("mN").value.trim(),p=parseFloat($("mP").value);
    if(!n){toast("Enter an item name.");return}
    if(!(p>=0)){toast("Enter a valid price.");return}
    if(FLAT[n]){toast("An item with this name already exists.");return}
    db.collection("menu").add({emoji:$("mE").value.trim()||"🍽️",name:n,price:p,cat:$("mC").value.trim()||"Menu",createdAt:Date.now()}).catch(function(e){toast("Couldn’t add the item: "+(e&&e.code||"error"))});
  };
  if(s)s.onclick=function(){var t=Date.now(),ps=[];
    DEFAULTS.forEach(function(c){c[1].forEach(function(i){ps.push(db.collection("menu").add({emoji:i[0],name:i[1],price:i[2],cat:c[0],createdAt:t+ps.length}))})});
    Promise.all(ps).catch(function(){alert("Couldn’t load the sample menu.")})};
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){
    if(!b.dataset.arm){b.dataset.arm="1";b.textContent="Tap again to delete";setTimeout(function(){b.dataset.arm="";b.textContent="Delete"},3000);return}
    b.disabled=true;
    db.doc("menu/"+b.getAttribute("data-del")).delete().catch(function(e){b.disabled=false;b.textContent="Delete";toast("Couldn’t delete: "+(e&&e.code||"error"))})}});
}
document.addEventListener("click",function(e){var g=e.target.getAttribute&&e.target.getAttribute("data-go");if(g){var el=$(g);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}});
function beep(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();var o=audio.createOscillator();o.connect(audio.destination);o.frequency.value=880;o.start();o.stop(audio.currentTime+.25)}catch(e){}}

render();
(async function(){
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){render();return}
  try{var u=await claude.use("user");isAdmin=!u||u.canEdit()||u.can("data.write")!==false}catch(e){}
  watchMine();
  db.collection("menu").orderBy("createdAt").limit(300).onSnapshot(function(s){buildMenu(s.docs);render()},function(){});
  db.collection("orders").orderBy("createdAt","desc").limit(100).onSnapshot(function(s){
    orders=s.docs;
    var ids=s.docs.map(function(d){return d.id});
    if(known&&view==="K"&&ids.some(function(i){return known.indexOf(i)<0}))beep();
    known=ids;if(!(view==="K"&&(tab==="menu"||!staffOk)))render();
  },function(){});
  render();
})();
</script>
</body>
</html>
